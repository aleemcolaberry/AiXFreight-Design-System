<!-- @dsCard group="AiXFreight App" viewport="1280x800" name="Control tower" subtitle="Dashboard · Shipments · Detail · New quote" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>AiXFreight — Control tower</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script>
<style>html,body,#root{height:100%}body{overflow:hidden}.aix-page{padding:28px;display:grid;gap:20px;align-content:start;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.aix-page.wide{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.aix-stats{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}@media (max-width:1279px){.aix-page,.aix-page.wide{grid-template-columns:minmax(0,1fr)}.aix-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script><script type="text/babel" src="Dashboard.jsx"></script><script type="text/babel" src="Shipments.jsx"></script><script type="text/babel" src="ShipmentDetail.jsx"></script><script type="text/babel" src="NewQuote.jsx"></script>
<script type="text/babel">
const { Button, Dialog, Toast, AiDisclosure } = window.AiXFreightDesignSystem_0c3a26;
function App(){
  const [page,setPage]=React.useState('dashboard'); const [sel,setSel]=React.useState(window.AIX_DATA.shipments[0]); const [rec,setRec]=React.useState(null); const [toast,setToast]=React.useState(null);
  const go=(p,s)=>{ if(s) setSel(s); setPage(p); };
  const titles={dashboard:'Dashboard',shipments:'Shipments',detail:sel.id,quote:'New quote',routes:'Routes',docs:'Documents',settings:'Settings'};
  const apply=()=>{ setRec(null); setToast({tone:'ai',title:'Route updated',message:rec.title+' applied to '+rec.shipment+'.'}); setTimeout(()=>setToast(null),4000); };
  return <div style={{display:'flex',height:'100%'}} data-screen-label={titles[page]}>
    <Sidebar page={page} go={go}/>
    <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Topbar title={titles[page]} crumbs={page==='detail'?['Shipments']:null} actions={page!=='quote'&&<Button size="sm" icon="plus" onClick={()=>go('quote')}>New quote</Button>}/>
      <div style={{flex:1,overflow:'auto'}}>
        {page==='dashboard'&&<Dashboard go={go} openRec={setRec}/>}
        {page==='shipments'&&<Shipments go={go}/>}
        {page==='detail'&&<ShipmentDetail s={sel} openRec={setRec}/>}
        {page==='quote'&&<NewQuote onDone={()=>{go('shipments');setToast({tone:'success',title:'Quotes requested',message:'3 carriers notified. Replies in ~2 hours.'});setTimeout(()=>setToast(null),4000);}}/>}
        {['routes','docs','settings'].includes(page)&&<div style={{padding:80,textAlign:'center',color:'var(--text-muted)'}}><p className="aix-caption">Not in kit</p><p style={{marginTop:8}}>This surface was not part of the provided materials.</p></div>}
      </div>
    </main>
    {rec&&<Dialog eyebrow={'AI recommendation · '+rec.shipment} title={rec.title} onClose={()=>setRec(null)} footer={<><Button variant="ghost" onClick={()=>setRec(null)}>Dismiss</Button><Button icon="sparkles" onClick={apply}>Apply recommendation</Button></>}><div style={{display:'flex',gap:24,fontFamily:'var(--font-mono)',fontWeight:500,fontSize:14}}><span>Cost <b style={{color:'var(--color-ai-orange-600)'}}>{rec.delta}</b></span><span>Impact <b style={{color:'var(--color-eco)'}}>{rec.gain}</b></span><span>Confidence <b>{rec.confidence}%</b></span></div><AiDisclosure defaultOpen confidence={rec.confidence} rationale={rec.body} sources={rec.sources} limits={rec.limits} style={{marginTop:16}}/></Dialog>}
    {toast&&<div style={{position:'fixed',right:24,bottom:24,zIndex:200}}><Toast {...toast} onClose={()=>setToast(null)}/></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
