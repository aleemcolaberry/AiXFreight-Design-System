/* ---------- Helpers ---------- */

const fmtK = (n) => '$' + (n / 1000).toFixed(1) + 'k';
const rankOf = (s) => SEV[s.severity].rank;
const fmtDelay = (h) => (h > 0 ? '+' + h + ' h' : '—');
const numbersLine = (p) => p.cost + ' · ' + p.impact + ' · ' + p.confidence + '%';

function useBreakpoint() {
  const get = () => (window.innerWidth >= 1280 ? 'wide' : window.innerWidth >= 900 ? 'compact' : 'narrow');
  const [bp, setBp] = React.useState(get);
  React.useEffect(() => { const h = () => setBp(get()); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);
  return bp;
}

function withAppliedEvent(s) {
  const lastDone = s.events.reduce((acc, e, i) => (e.done ? i : acc), -1);
  const events = s.events.map((e) => ({ ...e, current: false }));
  events.splice(lastDone + 1, 0, { time: 'Now', title: s.proposal.event, where: 'AI copilot', done: true, ai: true, current: true });
  return { ...s, applied: true, events };
}

function RecommendationCard({ s, onReview, compact }) {
  const p = s.proposal;
  if (s.applied) {
    return (
      <Card inverse eyebrow={'AI recommendation · ' + s.id} title="Applied" actions={<Badge tone="ai">AI applied</Badge>}>
        <p style={{ color: 'var(--text-on-inverse-muted)', fontSize: 13, lineHeight: 1.5, margin: 0 }}>{p.event}. Undo from the notification while it shows; the milestone records the change.</p>
      </Card>
    );
  }
  return (
    <Card inverse eyebrow={'AI recommendation · ' + s.id} title={p.title}
      footer={<>
        <span className="aix-caption" style={{ color: 'var(--text-on-inverse-muted)' }}>Confidence {p.confidence}%</span>
        <Button size="sm" icon="sparkles" onClick={onReview}>Review</Button>
      </>}>
      <p style={{ color: 'var(--text-on-inverse-muted)', fontSize: compact ? 13 : 14, lineHeight: 1.5, margin: 0 }}>{p.body}</p>
      <p style={{ marginTop: 12, marginBottom: 0, fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, color: 'var(--text-on-inverse)' }}>
        {p.cost} · {p.impact} · Confidence {p.confidence}%
      </p>
    </Card>
  );
}

  const fetchExceptions = React.useCallback(() => {
    setLoad('loading');
    if (demoState === 'loading') return;
    window.setTimeout(() => setLoad(demoState === 'error' ? 'error' : 'ready'), 700);
  }, [demoState]);

    window.clearTimeout(timer.current);
    setToast(t);
    timer.current = window.setTimeout(() => setToast(null), 4000);

  const dismissToast = () => { window.clearTimeout(timer.current); setToast(null); };

  /* derived */
  const open = shipments.filter((s) => !s.snoozed);
  const pending = open.filter((s) => !s.applied);
  const q = query.trim().toLowerCase();

    (modes.length === 0 || modes.includes(s.mode)) &&
    (q === '' || [s.id, s.origin, s.dest, s.type, s.carrier].join(' ').toLowerCase().includes(q)));
  const counts = { all: byModeAndQuery.length, critical: 0, high: 0, medium: 0 };
  byModeAndQuery.forEach((s) => { counts[s.severity] += 1; });
  const cmp = {
    id: (a, b) => a.id.localeCompare(b.id),
    severity: (a, b) => rankOf(a) - rankOf(b) || a.delayHrs - b.delayHrs,
    delayHrs: (a, b) => a.delayHrs - b.delayHrs,
    valueNum: (a, b) => a.valueNum - b.valueNum,
  };
  const rows = byModeAndQuery
    .filter((s) => tab === 'all' || s.severity === tab)
    .sort((a, b) => (sort.dir === 'asc' ? 1 : -1) * (cmp[sort.key] || cmp.id)(a, b));
  const filtersActive = tab !== 'all' || modes.length > 0 || q !== '';
  const clearFilters = () => { setTab('all'); setModes([]); setQuery(''); };

  const top = pending.filter((s) => s.proposal.impactHrs > 0).sort((a, b) => rankOf(b) - rankOf(a) || b.proposal.impactHrs - a.proposal.impactHrs)[0];
  const queue = pending.filter((s) => !top || s.id !== top.id).sort((a, b) => rankOf(b) - rankOf(a) || b.delayHrs - a.delayHrs).slice(0, 4);
  const criticalCount = pending.filter((s) => s.severity === 'critical').length;
  const valueAtRisk = pending.reduce((n, s) => n + s.valueNum, 0);
  const recoverable = pending.reduce((n, s) => n + s.proposal.impactHrs, 0);
  const appliedCount = open.filter((s) => s.applied).length;

  const drawerShipment = drawerId ? shipments.find((s) => s.id === drawerId) : null;
  const dialogShipment = dialogId ? shipments.find((s) => s.id === dialogId) : null;

  /* actions */
  const applyRecommendation = () => {
    const s = dialogShipment;
    if (!s) return;
    const before = shipments;
    setShipments((prev) => prev.map((x) => (x.id === s.id ? withAppliedEvent(x) : x)));
    setDialogId(null);
    showToast({ tone: 'ai', title: s.proposal.toastTitle, message: s.proposal.toastMsg, action: 'Undo', onAction: () => { setShipments(before); dismissToast(); } });
  };
  const snoozeSelected = () => {
    const ids = selected;
    const before = shipments;
    setShipments((prev) => prev.map((x) => (ids.includes(x.id) ? { ...x, snoozed: true } : x)));
    setSelected([]);
    showToast({ tone: 'info', title: 'Snoozed ' + ids.length + (ids.length === 1 ? ' exception' : ' exceptions'), message: 'Back in the queue tomorrow at 09:00.', action: 'Undo', onAction: () => { setShipments(before); dismissToast(); } });
  };
  const assignSelected = () => {
    const n = selected.length;
    setSelected([]);
    showToast({ tone: 'success', title: 'Assigned ' + n + (n === 1 ? ' exception' : ' exceptions'), message: 'Owner set to Maya Krishnan.' });
  };
  const shareTracking = (s) => showToast({ tone: 'info', title: 'Tracking link copied', message: 'Public link for ' + s.id + ' is on your clipboard for 24 h.' });

  const columns = [
    { key: 'id', label: 'Shipment', mono: true, nowrap: true, width: 120, sortable: true },
    { key: 'lane', label: 'Lane', muted: true, nowrap: true, maxWidth: 240, truncate: true, render: (v, r) => <span title={r.origin + ' → ' + r.dest}>{r.origin} → {r.dest}</span> },
    { key: 'mode', label: 'Mode', width: 90, render: (m) => <ModeBadge mode={m} size="sm" /> },
    { key: 'severity', label: 'Severity', width: 110, sortable: true, render: (v) => <Badge tone={SEV[v].tone} dot>{SEV[v].label}</Badge> },
    { key: 'type', label: 'Exception', muted: true, nowrap: true, maxWidth: 220, truncate: true, render: (v) => <span title={v}>{v}</span> },
    { key: 'eta', label: 'ETA', mono: true, nowrap: true },
    { key: 'delayHrs', label: 'Delay', mono: true, nowrap: true, align: 'right', sortable: true, render: (h) => <span style={{ color: h >= 48 ? 'var(--color-danger)' : h > 0 ? 'var(--text-primary)' : 'var(--text-muted)' }}>{fmtDelay(h)}</span> },
    { key: 'proposal', label: 'AI proposes', maxWidth: 280, render: (p, r) => r.applied
        ? <Badge tone="ai">Applied</Badge>
        : <div style={{ minWidth: 0 }}>
            <div className="aix-truncate" title={p.title} style={{ fontWeight: 500, color: 'var(--text-primary)' }}>{p.title}</div>
            <div className="aix-caption" style={{ marginTop: 2 }}>{numbersLine(p)}</div>
          </div> },
    { key: 'valueNum', label: 'Value', mono: true, nowrap: true, align: 'right', sortable: true, render: (v, r) => r.value },
  ];

  /* table region states */
  let tableRegion;
  if (load === 'loading') {
    tableRegion = <div style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 16 }}><Skeleton lines={2} /><Skeleton lines={4} /><Skeleton lines={4} /></div>;
  } else if (load === 'error') {
    tableRegion = <div style={{ padding: 20 }}><Alert tone="danger" title="Exceptions did not load" action="Retry" onAction={fetchExceptions}>The control-tower feed timed out after 30 s. Retry now; if it keeps failing, check the carrier connections under Settings.</Alert></div>;
  } else if (rows.length === 0 && filtersActive) {
    tableRegion = <EmptyState compact icon="search" title="No exceptions match" description="Try clearing a filter." action={<Button variant="secondary" size="sm" onClick={clearFilters}>Clear filters</Button>} />;
  } else if (rows.length === 0) {
    tableRegion = <EmptyState compact icon="circleCheck" title="No open exceptions" description="Every shipment is on plan. We'll alert you when one drifts." />;
  } else {
    tableRegion = <Table columns={columns} rows={rows} rowKey="id" stickyHeader selectable selected={selected} onSelect={setSelected}
      sort={sort} onSort={(k) => setSort((s) => ({ key: k, dir: s.key === k && s.dir === 'desc' ? 'asc' : 'desc' }))}
      onRowClick={(r) => setDrawerId(r.id)} />;
  }

  const topbarAction = bp === 'narrow'
    ? <IconButton icon="plus" label="New quote" variant="outline" />
    : <Button variant="navy" size="sm" icon="plus">New quote</Button>;

  return (
    <div style={{ display: 'flex', flexDirection: bp === 'narrow' ? 'column' : 'row', height: '100%' }}>
      {bp === 'narrow'
        ? <div className="aix-topnav">
            <Logo variant="mark" inverse height={28} base={DS_BASE} />
            <div className="aix-topnav-tabs"><Tabs variant="pill" inverse items={NAV.map((n) => ({ value: n.value, label: n.label }))} value={page} onChange={setPage} /></div>
          </div>
        : <SidebarNav base={DS_BASE} value={page} onChange={setPage} items={NAV} collapsed={bp === 'compact'} footer={bp === 'wide' ? <AiCopilotCard waiting={pending.length} /> : null} />}

      <main style={{ flex: 1, minWidth: 0, minHeight: 0, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <Topbar title="Exceptions" search={bp !== 'narrow'} searchPlaceholder="Search shipments, lanes, carriers…" onSearch={setQuery}
          user={{ name: 'Maya Krishnan' }} notifications themeToggle actions={topbarAction} />

        <div style={{ flex: 1, overflow: 'auto' }}>
          <div className="aix-page">
            <div className="aix-stats">
              <StatCard label="Open exceptions" value={pending.length} delta={criticalCount + ' critical'} deltaTone={criticalCount ? 'danger' : 'neutral'} hint="Updated 2 min ago" />
              <StatCard label="Value at risk" value={fmtK(valueAtRisk)} delta={pending.length + ' shipments'} deltaTone="neutral" hint="Declared value" />
              <StatCard label="AI proposals ready" value={pending.length} delta={appliedCount + ' applied today'} deltaTone="ai" hint="Cost, impact and confidence per row" />
              <StatCard label="Recoverable delay" value={recoverable + ' h'} delta={(recoverable / 24).toFixed(1) + ' days'} deltaTone="success" hint="If every proposal is applied" />
            </div>

            <Card padding={0} style={{ minWidth: 0 }}>
              <div className="aix-toolbar">
                <div className="aix-toolbar-tabs">
                  <Tabs style={{ borderBottom: 0 }} value={tab} onChange={setTab} items={[
                    { value: 'all', label: 'All', count: counts.all },
                    { value: 'critical', label: 'Critical', count: counts.critical },
                    { value: 'high', label: 'High', count: counts.high },
                    { value: 'medium', label: 'Medium', count: counts.medium },
                  ]} />
                </div>
                <div className="aix-toolbar-tags" role="group" aria-label="Filter by mode">
                  <span className="aix-caption" style={{ alignSelf: 'center', marginRight: 4 }}>Mode</span>
                  {MODES.map(([m, l]) => <Tag key={m} selected={modes.includes(m)} onClick={() => setModes((cur) => (cur.includes(m) ? cur.filter((x) => x !== m) : [...cur, m]))}>{l}</Tag>)}
                  {filtersActive ? <Button variant="ghost" size="sm" onClick={clearFilters}>Clear</Button> : null}
                </div>
              </div>

              {selected.length > 0 ? (
                <div className="aix-bulk">
                  <span className="aix-caption" style={{ color: 'var(--text-primary)' }}>{selected.length} selected</span>
                  <Button variant="secondary" size="sm" icon="user" onClick={assignSelected}>Assign to me</Button>
                  <Button variant="secondary" size="sm" icon="clock" onClick={snoozeSelected}>Snooze 24 h</Button>
                  <Button variant="ghost" size="sm" onClick={() => setSelected([])}>Clear selection</Button>
                </div>
              ) : null}

              {tableRegion}

              {load === 'ready' && rows.length > 0 ? (
                <div style={{ padding: '12px 20px', borderTop: '1px solid var(--border-default)' }}>
                  <Pagination page={1} pageCount={1} total={rows.length} pageSize={25} />
                </div>
              ) : null}
            </Card>

            <div className="aix-side">
              {load === 'loading' ? (
                <Card inverse eyebrow="AI recommendation" title="Reading the queue"><Skeleton lines={3} /></Card>
              ) : load === 'error' ? (
                <Card inverse eyebrow="AI copilot" title="Waiting for the feed"><p style={{ color: 'var(--text-on-inverse-muted)', fontSize: 13, lineHeight: 1.5, margin: 0 }}>Recommendations resume when the exception feed reconnects.</p></Card>
              ) : top ? (
                <RecommendationCard s={top} compact onReview={() => setDialogId(top.id)} />
              ) : (
                <Card inverse eyebrow="AI copilot" title="No action needed"><p style={{ color: 'var(--text-on-inverse-muted)', fontSize: 13, lineHeight: 1.5, margin: 0 }}>Every open exception has its plan. We'll surface the next recommendation the moment an ETA moves.</p></Card>
              )}

              <Card eyebrow="Queue" title="Next recommendations">
                {load !== 'ready' ? <Skeleton lines={4} /> : queue.length === 0 ? (
                  <EmptyState compact icon="circleCheck" title="Queue is clear" description="Nothing else is waiting for a decision." />
                ) : (
                  <ul className="aix-queue">
                    {queue.map((s) => (
                      <li key={s.id}>
                        <button type="button" onClick={() => setDrawerId(s.id)} aria-label={'Open ' + s.id}>
                          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 12 }}>{s.id}</span>
                          <span style={{ minWidth: 0 }}>
                            <span className="aix-truncate" title={s.proposal.title} style={{ display: 'block', fontWeight: 500 }}>{s.proposal.title}</span>
                            <span className="aix-caption" style={{ display: 'block', marginTop: 2 }}>{numbersLine(s.proposal)}</span>
                          </span>
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </Card>
            </div>
          </div>
        </div>
      </main>

      {drawerShipment ? (
        <Drawer open eyebrow={'Shipment · ' + drawerShipment.type} title={drawerShipment.id} width={480} style={{ width: 'min(480px, 100vw)' }}
          onClose={dialogId ? undefined : () => setDrawerId(null)}
          footer={<>
            <Button variant="ghost" onClick={() => setDrawerId(null)}>Close</Button>
            <Button variant="secondary" icon="route" onClick={() => shareTracking(drawerShipment)}>Share tracking</Button>
          </>}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
              <ModeBadge mode={drawerShipment.mode} size="sm" />
              <Badge tone={SEV[drawerShipment.severity].tone} dot>{SEV[drawerShipment.severity].label}</Badge>
              {drawerShipment.applied ? <Badge tone="ai">AI applied</Badge> : null}
              <span className="aix-caption" style={{ marginLeft: 'auto' }}>{drawerShipment.carrier}</span>
            </div>
            <div style={{ fontSize: 17, fontWeight: 600, color: 'var(--text-primary)', minWidth: 0 }}>
              {drawerShipment.origin} <span style={{ color: 'var(--text-muted)' }}>→</span> {drawerShipment.dest}
            </div>
            <RouteLine from={drawerShipment.legs[0]} to={drawerShipment.legs[1]} progress={drawerShipment.progress} aiAt={drawerShipment.applied ? drawerShipment.progress / 100 : undefined} />
            <div className="aix-kv">
              <KeyValue label="Cargo" value={drawerShipment.cargo} mono />
              <KeyValue label="Declared value" value={drawerShipment.value} mono />
              <KeyValue label="Planned ETA" value={drawerShipment.etaPlanned} mono />
              <KeyValue label="Revised ETA" value={drawerShipment.eta} mono />
              <KeyValue label="Delay" value={fmtDelay(drawerShipment.delayHrs)} mono />
              <KeyValue label="Exception" value={drawerShipment.type} />
            </div>
            <RecommendationCard s={drawerShipment} compact onReview={() => setDialogId(drawerShipment.id)} />
            <div>
              <div className="aix-caption" style={{ marginBottom: 16 }}>Milestones</div>
              <Timeline orientation="vertical" events={drawerShipment.events} />
            </div>
          </div>
        </Drawer>
      ) : null}

      {dialogShipment ? (
        <Dialog open eyebrow={'AI recommendation · ' + dialogShipment.id} title={dialogShipment.proposal.question} onClose={() => setDialogId(null)}
          footer={<>
            <Button variant="ghost" onClick={() => setDialogId(null)}>Dismiss</Button>
            <Button icon="sparkles" onClick={applyRecommendation}>Apply recommendation</Button>
          </>}>
          <p style={{ margin: 0 }}>{dialogShipment.proposal.body}</p>
          <div className="aix-numbers">
            <div><div className="aix-caption">Cost</div><div className="val">{dialogShipment.proposal.cost}</div></div>
            <div><div className="aix-caption">Impact</div><div className="val">{dialogShipment.proposal.impact}</div></div>
            <div><div className="aix-caption">Confidence</div><div className="val">{dialogShipment.proposal.confidence}%</div></div>
          </div>
          <p className="aix-caption" style={{ marginTop: 16, marginBottom: 0 }}>{dialogShipment.origin} → {dialogShipment.dest} · {dialogShipment.carrier} · revised ETA {dialogShipment.eta}</p>
        </Dialog>
      ) : null}

      {toast ? (
        <div style={{ position: 'fixed', right: 24, bottom: 24, zIndex: 200, maxWidth: 'calc(100vw - 48px)' }}>
          <Toast tone={toast.tone} title={toast.title} message={toast.message} action={toast.action} onAction={toast.onAction} onClose={dismissToast} />
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
