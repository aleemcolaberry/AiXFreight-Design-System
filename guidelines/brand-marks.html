<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.sw{flex:1 1 0;min-width:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}.sw i{display:block;height:64px}.sw b{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px;color:var(--text-primary)}.sw span{display:block;font:400 11px/1.3 var(--font-mono);padding:0 8px 8px;color:var(--text-muted)}.dark{background:var(--surface-inverse)}.dark .sw{border-color:var(--border-inverse)}.dark .sw b{color:#fff}.dark .sw span{color:var(--text-on-inverse-muted)}.row{display:flex;gap:12px;width:100%;flex-wrap:wrap}</style></head><body><div style="display:flex;gap:12px;width:100%;align-items:stretch"><div style="flex:1;display:grid;place-items:center;padding:14px;border:1px solid var(--border-default);border-radius:8px"><img src="../assets/logo/mark-horizontal.svg" style="height:80px"></div><div style="flex:1;display:grid;place-items:center;padding:14px;border:1px solid var(--border-default);border-radius:8px"><img src="../assets/logo/mark-vertical.svg" style="height:100px"></div><div style="flex:1;display:grid;place-items:center;padding:14px;background:var(--surface-inverse);border-radius:8px"><img src="../assets/logo/mark-dark.svg" style="height:80px"></div><div style="flex:0 0 120px;display:grid;place-items:center;padding:14px;border:1px solid var(--border-default);border-radius:8px"><img src="../assets/logo/app-icon.png" style="height:96px;border-radius:22px"></div></div></body></html>
