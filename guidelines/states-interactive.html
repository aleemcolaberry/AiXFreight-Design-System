<!-- @dsCard group="Interaction" viewport="700x150" name="Interactive states" subtitle="Default → hover → pressed → focus → disabled → loading" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap"><div style="text-align:center"><span class="btn" style="background:var(--accent);border-color:var(--accent);box-shadow:none;opacity:1;">Apply route</span><div class="cap" style="margin-top:6px">Default</div></div><div style="text-align:center"><span class="btn" style="background:#E05E00;border-color:#E05E00;box-shadow:none;opacity:1;">Apply route</span><div class="cap" style="margin-top:6px">Hover</div></div><div style="text-align:center"><span class="btn" style="background:#E05E00;border-color:#E05E00;box-shadow:none;opacity:1;transform:scale(.98)">Apply route</span><div class="cap" style="margin-top:6px">Pressed</div></div><div style="text-align:center"><span class="btn" style="background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,0,.35);opacity:1;">Apply route</span><div class="cap" style="margin-top:6px">Focus</div></div><div style="text-align:center"><span class="btn" style="background:var(--accent);border-color:var(--accent);box-shadow:none;opacity:.45;">Apply route</span><div class="cap" style="margin-top:6px">Disabled</div></div><div style="text-align:center"><span class="btn" style="background:var(--accent);border-color:var(--accent);box-shadow:none;opacity:1;"><span style="width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:999px;display:inline-block;margin-right:8px"></span>Saving…</span><div class="cap" style="margin-top:6px">Loading</div></div></div>
<p class="small">Hover darkens one step (120ms). Press scales .98. Disabled = 45% opacity, cursor not-allowed, label stays. Loading keeps width; text becomes a verb-ing form.</p></body></html>
