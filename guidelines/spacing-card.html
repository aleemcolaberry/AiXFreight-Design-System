<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.sw{flex:1 1 0;min-width:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}.sw i{display:block;height:64px}.sw b{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px;color:var(--text-primary)}.sw span{display:block;font:400 11px/1.3 var(--font-mono);padding:0 8px 8px;color:var(--text-muted)}.dark{background:var(--surface-inverse)}.dark .sw{border-color:var(--border-inverse)}.dark .sw b{color:#fff}.dark .sw span{color:var(--text-on-inverse-muted)}.row{display:flex;gap:12px;width:100%;flex-wrap:wrap}</style></head><body><div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:24px;box-shadow:var(--shadow-sm);width:420px;position:relative"><div class="aix-caption">Shipment</div><h3 style="font-size:22px;margin:4px 0 8px">AIX-48211 · Shenzhen → Hamburg</h3><p style="color:var(--text-secondary);font-size:13px">Ocean · 2 × 40HC · ETA 14 Sep</p><div style="position:absolute;inset:0;border:1px dashed var(--accent);margin:24px;pointer-events:none;border-radius:4px"></div></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);align-self:center">dashed = 24px content inset</div></body></html>
