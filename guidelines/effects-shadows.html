<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Navy-tinted shadows: sm · md · lg · accent glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.sw{flex:1 1 0;min-width:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}.sw i{display:block;height:64px}.sw b{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px;color:var(--text-primary)}.sw span{display:block;font:400 11px/1.3 var(--font-mono);padding:0 8px 8px;color:var(--text-muted)}.dark{background:var(--surface-inverse)}.dark .sw{border-color:var(--border-inverse)}.dark .sw b{color:#fff}.dark .sw span{color:var(--text-on-inverse-muted)}.row{display:flex;gap:12px;width:100%;flex-wrap:wrap}</style></head><body><div style="display:flex;gap:24px;padding:8px"><div style="text-align:center"><div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);"></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:10px">shadow-sm</div></div><div style="text-align:center"><div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-md);"></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:10px">shadow-md</div></div><div style="text-align:center"><div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);"></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:10px">shadow-lg</div></div><div style="text-align:center"><div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-accent);background:var(--accent)"></div><div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:10px">shadow-accent</div></div></div></body></html>
