<!-- @dsCard group="Interaction" viewport="700x140" name="Selection & active" subtitle="Navy fills for selection; orange only marks the active/AI item" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="chip" style="border:1px solid var(--border-default);color:var(--text-secondary)">Unselected tag</span><span class="chip" style="background:var(--color-navy);color:#fff">Selected tag</span><span style="display:inline-flex;align-items:center;height:40px;padding:0 12px;border-radius:8px;background:#12244A;color:#fff;font:500 14px var(--font-body);box-shadow:inset 3px 0 0 var(--accent)">Active nav item</span><span style="display:inline-flex;align-items:center;height:40px;border-bottom:2px solid var(--accent);font:600 14px var(--font-body)">Active tab</span><span style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font:500 13px var(--font-mono)">Selected row</span></div>
<p class="small">Selected = navy (tags, checkboxes, pagination). Active = 3px orange bar or 2px orange underline. Selected table rows use Orange-100 — the only pale orange surface.</p></body></html>
