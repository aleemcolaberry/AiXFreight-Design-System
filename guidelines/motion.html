<!-- @dsCard group="Interaction" viewport="700x150" name="Motion" subtitle="Ease-out, 120 / 200 / 320ms — fades and slides, never bounces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div style="border:1px solid var(--border-default);border-radius:10px;padding:14px"><div style="font:600 15px var(--font-display);text-transform:uppercase">Fast · 120ms</div><div class="small" style="margin-top:4px">hover color, focus ring, tooltip</div></div><div style="border:1px solid var(--border-default);border-radius:10px;padding:14px"><div style="font:600 15px var(--font-display);text-transform:uppercase">Base · 200ms</div><div class="small" style="margin-top:4px">switch, tab indicator, card shadow</div></div><div style="border:1px solid var(--border-default);border-radius:10px;padding:14px"><div style="font:600 15px var(--font-display);text-transform:uppercase">Slow · 320ms</div><div class="small" style="margin-top:4px">sidebar collapse, drawer slide, progress fill</div></div></div>
<div style="display:flex;gap:24px;margin-top:12px;align-items:center"><svg width="120" height="50" viewBox="0 0 120 50" fill="none"><path d="M4 46 C 28 46, 28 4, 116 4" stroke="var(--accent)" stroke-width="3"/><text x="4" y="14" font-family="IBM Plex Mono" font-size="9" fill="var(--text-muted)">ease-out .2,.8,.2,1</text></svg><p class="small" style="margin:0">Enter: fade + 8px rise. Exit: fade only, half duration. Shimmer 1.4s. Respect <code>prefers-reduced-motion</code>: drop transforms, keep fades.</p></div></body></html>
