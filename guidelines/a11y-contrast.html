der-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><span style="color:#FFFFFF;font:600 15px var(--font-body)">White on navy</span><span style="display:flex;justify-content:space-between;font:500 10px var(--font-mono);color:#FFFFFF;opacity:.8"><span>16.9:1</span><span>AAA</span></span></div><div style="background:#0A1931;border:1px solid var(--border-default);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><span style="color:#8FA3BA;font:600 15px var(--font-body)">Steel on navy</span><span style="display:flex;justify-content:space-between;font:500 10px var(--font-mono);color:#8FA3BA;opacity:.8"><span>7.1:1</span><span>AAA</span></span></div><div style="background:#FF6B00;border:1px solid var(--border-default);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><span style="color:#FFFFFF;font:600 15px var(--font-body)">White on orange</span><span style="display:flex;justify-content:space-between;font:500 10px var(--font-mono);color:#FFFFFF;opacity:.8"><span>3.0:1</span><span>AA large / buttons</span></span></div></div>
