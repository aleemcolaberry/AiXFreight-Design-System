<!-- @dsCard group="Patterns" viewport="700x180" name="Loading, empty, error" subtitle="Skeleton for known shapes · EmptyState for zero results · Alert for recoverable errors · never a blank screen" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border:1px solid var(--border-default);border-radius:10px;padding:14px"><div class="cap">Loading</div><div style="margin-top:10px;display:flex;flex-direction:column;gap:8px"><div style="height:18px;width:40%;border-radius:4px;background:var(--surface-sunken)"></div><div style="height:12px;border-radius:4px;background:var(--surface-sunken)"></div><div style="height:12px;width:80%;border-radius:4px;background:var(--surface-sunken)"></div><div style="height:12px;width:60%;border-radius:4px;background:var(--surface-sunken)"></div></div></div>
<div style="border:1px solid var(--border-default);border-radius:10px;padding:14px;text-align:center"><div class="cap" style="text-align:left">Empty</div><div style="width:40px;height:40px;border:3px solid var(--border-default);border-radius:999px;margin:8px auto 6px"></div><div style="font:600 16px var(--font-display);text-transform:uppercase">No shipments match</div><div class="small" style="margin-top:2px">Try clearing a filter.</div></div>
<div style="border:1px solid var(--border-default);border-radius:10px;padding:14px"><div class="cap">Error</div><div style="margin-top:10px;background:var(--color-danger-bg);border-radius:8px;padding:10px 12px"><div style="font:600 13px var(--font-body);color:var(--color-danger)">Couldn’t load shipments</div><div class="small" style="margin-top:2px">Connection lost. <b>Retry</b></div></div></div></div></body></html>
