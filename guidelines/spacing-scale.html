<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.sw{flex:1 1 0;min-width:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}.sw i{display:block;height:64px}.sw b{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px;color:var(--text-primary)}.sw span{display:block;font:400 11px/1.3 var(--font-mono);padding:0 8px 8px;color:var(--text-muted)}.dark{background:var(--surface-inverse)}.dark .sw{border-color:var(--border-inverse)}.dark .sw b{color:#fff}.dark .sw span{color:var(--text-on-inverse-muted)}.row{display:flex;gap:12px;width:100%;flex-wrap:wrap}</style></head><body><div style="display:flex;align-items:flex-end;gap:12px"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--color-ocean);border-radius:2px;margin:0 auto"></div><div style="font:500 10px var(--font-mono);color:var(--text-muted);margin-top:6px">64</div></div></div></body></html>
