<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success reuses eco teal, warning reuses gold" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.sw{flex:1 1 0;min-width:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}.sw i{display:block;height:64px}.sw b{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px;color:var(--text-primary)}.sw span{display:block;font:400 11px/1.3 var(--font-mono);padding:0 8px 8px;color:var(--text-muted)}.dark{background:var(--surface-inverse)}.dark .sw{border-color:var(--border-inverse)}.dark .sw b{color:#fff}.dark .sw span{color:var(--text-on-inverse-muted)}.row{display:flex;gap:12px;width:100%;flex-wrap:wrap}</style></head><body><div class="sw" style=""><i style="background:#0F8B8F"></i><b>Success</b><span>#0F8B8F</span></div><div class="sw" style=""><i style="background:#FFAB00"></i><b>Warning</b><span>#FFAB00</span></div><div class="sw" style=""><i style="background:#D63B1F"></i><b>Danger</b><span>#D63B1F</span></div><div class="sw" style=""><i style="background:#0F55A0"></i><b>Info</b><span>#0F55A0</span></div><div class="sw" style=""><i style="background:#D5F0F0"></i><b>Success bg</b><span>#D5F0F0</span></div><div class="sw" style=""><i style="background:#FBE1DB"></i><b>Danger bg</b><span>#FBE1DB</span></div></body></html>
