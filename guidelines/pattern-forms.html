<!-- @dsCard group="Patterns" viewport="700x160" name="Form validation" subtitle="Validate on blur, summarize on submit; errors inline under the field; required marked with orange *" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start">
<div><div class="cap" style="color:var(--text-secondary)">Origin <span style="color:var(--accent)">*</span></div><div style="height:40px;border:1px solid var(--border-default);border-radius:8px;margin-top:6px;padding:0 12px;display:flex;align-items:center;font:14px var(--font-body)">Shenzhen, CN</div><div class="small" style="margin-top:4px;font-size:12px">Default · hint in gray</div></div>
<div><div class="cap" style="color:var(--color-danger)">Container <span style="color:var(--accent)">*</span></div><div style="height:40px;border:1px solid var(--color-danger);border-radius:8px;margin-top:6px;padding:0 12px;display:flex;align-items:center;font:500 14px var(--font-mono)">MSKU 482 119-X</div><div class="small" style="margin-top:4px;font-size:12px;color:var(--color-danger)">Check digit invalid — IDs end in 0–9.</div></div>
<div><div class="cap" style="color:var(--text-secondary)">Weight</div><div style="height:40px;border:1px solid var(--color-eco);border-radius:8px;margin-top:6px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font:14px var(--font-body)">18,200 <span class="cap" style="color:var(--color-eco)">✓ kg</span></div><div class="small" style="margin-top:4px;font-size:12px">Valid · confirm only when it matters (IDs, totals)</div></div></div></body></html>
