<!-- @dsCard group="Accessibility" viewport="700x140" name="Touch targets & labels" subtitle="44px minimum on touch, 32px on dense desktop; icon-only controls need aria-label" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;gap:28px;align-items:flex-end"><div style="text-align:center"><span style="display:grid;place-items:center;width:48px;height:48px;border-radius:8px;background:var(--accent);color:#fff;font:600 14px var(--font-body)">48</span><div class="cap" style="margin-top:6px">hero / mobile</div></div><div style="text-align:center"><span style="display:grid;place-items:center;width:44px;height:44px;border-radius:8px;border:2px dashed var(--color-eco);color:var(--color-eco);font:600 13px var(--font-body)">44</span><div class="cap" style="margin-top:6px">touch min</div></div><div style="text-align:center"><span style="display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--color-navy);color:#fff;font:600 13px var(--font-body)">40</span><div class="cap" style="margin-top:6px">default</div></div><div style="text-align:center"><span style="display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border-strong);font:600 12px var(--font-body)">32</span><div class="cap" style="margin-top:6px">dense desktop</div></div><p class="small" style="margin:0 0 8px;max-width:260px">IconButton requires <code>label</code>. Badges never carry meaning by color alone — pair with text ("On time").</p></div></body></html>
