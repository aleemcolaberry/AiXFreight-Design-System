<!-- @dsCard group="Brand" viewport="700x170" name="Logo misuse" subtitle="Never recolor, stretch, rotate, place light artwork on navy, or crowd the mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
<div class="do dont" style="display:grid;place-items:center;height:110px"><img src="../assets/logo/mark-horizontal.svg" style="height:56px;filter:grayscale(1)"><span class="cap">Recolored</span></div>
<div class="do dont" style="display:grid;place-items:center;height:110px;overflow:hidden"><img src="../assets/logo/mark-horizontal.svg" style="height:40px;width:150px"><span class="cap">Stretched</span></div>
<div class="do dont" style="display:grid;place-items:center;height:110px"><img src="../assets/logo/mark-horizontal.svg" style="height:56px;transform:rotate(-18deg)"><span class="cap">Rotated</span></div>
<div class="do dont" style="display:grid;place-items:center;height:110px;background:var(--color-navy)"><img src="../assets/logo/mark-horizontal.svg" style="height:56px"><span class="cap" style="color:var(--text-on-inverse-muted)">Light art on navy</span></div>
<div class="do" style="display:grid;place-items:center;height:110px;background:var(--color-navy)"><img src="../assets/logo/mark-dark.svg" style="height:56px"><span class="cap" style="color:var(--text-on-inverse-muted)">Dark art on navy</span></div></div></body></html>
