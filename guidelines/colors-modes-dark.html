<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.sw{flex:1 1 0;min-width:90px;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}.sw i{display:block;height:64px}.sw b{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px;color:var(--text-primary)}.sw span{display:block;font:400 11px/1.3 var(--font-mono);padding:0 8px 8px;color:var(--text-muted)}.dark{background:var(--surface-inverse)}.dark .sw{border-color:var(--border-inverse)}.dark .sw b{color:#fff}.dark .sw span{color:var(--text-on-inverse-muted)}.row{display:flex;gap:12px;width:100%;flex-wrap:wrap}</style></head><body class="dark"><div class="sw" style="background:var(--surface-inverse-raised)"><i style="background:#E2E8F0"></i><b>Land</b><span>#E2E8F0</span></div><div class="sw" style="background:var(--surface-inverse-raised)"><i style="background:#3FC0F0"></i><b>Air</b><span>#3FC0F0</span></div><div class="sw" style="background:var(--surface-inverse-raised)"><i style="background:#4A9BE8"></i><b>Ocean</b><span>#4A9BE8</span></div><div class="sw" style="background:var(--surface-inverse-raised)"><i style="background:#FF6B00"></i><b>AI</b><span>#FF6B00</span></div><div class="sw" style="background:var(--surface-inverse-raised)"><i style="background:#FFAB00"></i><b>Gold</b><span>#FFAB00</span></div></body></html>
