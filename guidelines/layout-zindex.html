<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div style="text-align:center;flex:1"><div style="height:28px;background:var(--surface-page);border:1px solid var(--border-default);border-radius:6px;box-shadow:none"></div><div class="cap" style="margin-top:6px">Page<br>z 0</div></div><div style="text-align:center;flex:1"><div style="height:34px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-sm)"></div><div class="cap" style="margin-top:6px">Card<br>z 1</div></div><div style="text-align:center;flex:1"><div style="height:40px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-sm)"></div><div class="cap" style="margin-top:6px">Sticky<br>z 10</div></div><div style="text-align:center;flex:1"><div style="height:46px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-sm)"></div><div class="cap" style="margin-top:6px">Topbar<br>z 20</div></div><div style="text-align:center;flex:1"><div style="height:52px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-lg)"></div><div class="cap" style="margin-top:6px">Dropdown<br>z 40</div></div><div style="text-align:center;flex:1"><div style="height:58px;background:var(--color-navy);border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-md)"></div><div class="cap" style="margin-top:6px">Tooltip<br>z 50</div></div><div style="text-align:center;flex:1"><div style="height:64px;background:#fff;border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-lg)"></div><div class="cap" style="margin-top:6px">Dialog<br>z 100</div></div><div style="text-align:center;flex:1"><div style="height:70px;background:var(--color-navy);border:1px solid var(--border-default);border-radius:6px;box-shadow:var(--shadow-lg)"></div><div class="cap" style="margin-top:6px">Toast<br>z 200</div></div></div></body></html>
