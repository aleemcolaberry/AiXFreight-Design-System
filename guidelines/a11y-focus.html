<!-- @dsCard group="Accessibility" viewport="700x150" name="Focus & keyboard" subtitle="Visible focus ring on every control; tab order follows reading order" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:16px}.g{display:grid;gap:12px}.cap{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.do{border:1px solid var(--border-default);border-radius:10px;padding:14px;position:relative}.do::before{content:"DO";position:absolute;top:-8px;left:12px;background:var(--color-eco);color:#fff;font:500 10px var(--font-mono);letter-spacing:.08em;padding:2px 6px;border-radius:3px}.dont::before{content:"DON’T";background:var(--color-danger)}.small{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-body);color:#fff;background:var(--accent);border:1px solid var(--accent)}.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><span class="btn" style="box-shadow:0 0 0 3px rgba(255,107,0,.35)">Primary · focused</span><span class="btn" style="background:#fff;color:var(--text-primary);border-color:var(--border-strong);box-shadow:0 0 0 3px rgba(255,107,0,.35)">Secondary · focused</span><span style="display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid var(--color-navy);border-radius:8px;box-shadow:0 0 0 3px rgba(10,25,49,.12);font:14px var(--font-body);color:var(--text-muted);width:180px">Input · focused</span><span style="display:inline-block;width:18px;height:18px;border-radius:4px;border:2px solid var(--color-navy);box-shadow:0 0 0 3px rgba(255,107,0,.35)"></span></div>
<p class="small">Ring = <code>--focus-ring</code> 3px AI Orange at 35%; inputs use a navy 12% ring so orange stays reserved for actions. Never <code>outline:none</code> without a replacement. Space/Enter activate custom controls; Esc closes Dialog, Drawer, DropdownMenu.</p></body></html>
